name: App

# The Flutter app in app/. Every push to main builds Android and Windows.
# macOS builds on version tags and manual runs only: macOS minutes cost 10x on private repos.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build the macOS app"
        type: boolean
        default: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Use the release signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - name: Build (one small APK per CPU type)
        # Gradle downloads itself from GitHub releases, which sometimes answers 504.
        # Retry only that failure; a real build error fails straight away.
        # After one green run, setup-java's cache holds Gradle and this download is skipped.
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            if [ "$attempt" -gt 1 ]; then
              echo "::warning::Gradle download failed, retrying (attempt $attempt of 4)"
              sleep $(( (attempt - 1) * 30 ))
            fi
            flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols 2>&1 | tee build.log && exit 0
            grep -q 'org.gradle.wrapper.Download' build.log || exit 1
          done
          exit 1
      - name: Name the APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/SpendingTracker-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/SpendingTracker-android-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/SpendingTracker-android-x86_64.apk
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: SpendingTracker-android
          path: app/dist/*.apk

  windows:
    name: Windows
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release --obfuscate --split-debug-info=build/symbols
      - name: Zip the app folder
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath SpendingTracker-windows.zip
          Get-Item SpendingTracker-windows.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: SpendingTracker-windows
          path: app/SpendingTracker-windows.zip

  macos:
    name: macOS
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build macos --release --obfuscate --split-debug-info=build/symbols
      - name: Zip the app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Spending Tracker.app" SpendingTracker-macos.zip
          ls -la SpendingTracker-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpendingTracker-macos
          path: app/SpendingTracker-macos.zip

  release:
    name: Release
    needs: [android, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
