name: Build

# The Go laptop app. Changes that only touch the Flutter app (app/) don't rebuild it.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build Windows app
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o SpendingTracker.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: SpendingTracker
          path: SpendingTracker.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SpendingTracker.exe
