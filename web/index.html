<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spending Tracker</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#111110">
<style>
  :root { color-scheme:dark; --bg:#111110; --card:#1a1a19; --input:#222220; --text:#f0efec; --text2:#c3c2b7; --muted:#a09f97; --line:#2f2f2c;
          --accent:#2563eb; --bar:#3987e5; --good:#4ade80; --spend:#f87171; --radius:4px; --gap:16px; --pad:22px; }
  @media (max-width:420px) { :root { --gap:14px; --pad:18px; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.4; background:var(--bg); color:var(--text); }
  .wrap { max-width:1100px; margin:0 auto; padding:28px 16px 64px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:24px; }
  h1 { font-size:22px; margin:0; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  select, button { font:inherit; font-size:14px; padding:9px 14px; border-radius:var(--radius); border:1px solid var(--line); background:var(--input); color:var(--text); }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.6; cursor:default; }
  button.plain { background:var(--input); color:var(--text); border:1px solid var(--line); font-weight:500; }
  #logout { margin:0; }
  #status { color:var(--muted); font-size:13px; }
  #error { display:none; background:#2a1515; color:#fca5a5; border:1px solid #5c2424; padding:14px 16px; border-radius:var(--radius); margin-bottom:var(--gap); font-size:14px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:var(--pad); min-width:0; }

  /* Overview: the number is the focal point on its own line; each line under it says one thing */
  .overview { display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--gap); margin-bottom:var(--gap); }
  .overview .hero { grid-column:1 / -1; }
  .overview.past { grid-template-columns:1fr; }
  .num { font-size:clamp(22px, 6.2vw, 30px); font-weight:700; line-height:1.15; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .hero .num { font-size:clamp(36px, 11vw, 48px); letter-spacing:-0.5px; }
  .desc { color:var(--text2); font-size:15px; margin-top:10px; }
  .hero .desc { font-size:16px; }
  .extra { color:var(--muted); font-size:14px; margin-top:3px; }
  .good { color:var(--good); } .spend { color:var(--spend); }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); margin-bottom:var(--gap); }
  @media (max-width:800px) {
    /* Phone: left full width, then per day | this week, then this month full width */
    .overview { grid-template-columns:1fr 1fr; }
    .overview .wide { grid-column:1 / -1; }
    .grid { grid-template-columns:1fr; }
  }

  /* Lists: the first line is the name with the amount on the right; each line under it says one thing */
  h2 { font-size:16px; margin:0; }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .row { padding:16px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; padding-bottom:0; }
  .line1 { display:flex; justify-content:space-between; align-items:baseline; gap:16px; font-size:15px; }
  .name { min-width:0; overflow-wrap:anywhere; }
  .amt { white-space:nowrap; font-variant-numeric:tabular-nums; }
  .amt.in { color:var(--good); }
  .meta { color:var(--muted); font-size:13px; margin-top:5px; }
  .barline { display:flex; align-items:center; gap:12px; margin-top:10px; }
  .bar { flex:1; height:6px; background:var(--line); border-radius:2px; overflow:hidden; }
  .bar span { display:block; height:100%; background:var(--bar); }
  .pct { color:var(--muted); font-size:13px; min-width:3em; text-align:right; font-variant-numeric:tabular-nums; }
  .empty { color:var(--muted); font-size:14px; margin:16px 0 0; }
  .more { color:var(--muted); font-size:13px; padding-top:16px; }

  /* Tappable cards open a full view */
  .tap { cursor:pointer; }
  .tap:hover, .tap:focus-visible { border-color:#45453f; outline:none; }
  .chev { display:inline-block; flex:none; width:8px; height:8px; margin-right:4px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
          transform:rotate(-45deg); transition:transform .15s; }

  /* Full view: covers the dashboard; the phone's back gesture closes it */
  .sheet { position:fixed; inset:0; z-index:10; background:var(--bg); overflow-y:auto; }
  .sheet-head { position:sticky; top:0; z-index:1; background:var(--bg); border-bottom:1px solid var(--line); }
  .sheet-head > div { max-width:760px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:14px; }
  .sheet-head h2 { font-size:17px; }
  .sheet-head .meta { margin-top:2px; }
  .back { font-size:22px; line-height:1; padding:6px 13px 8px; }
  .sheet-body { max-width:760px; margin:0 auto; padding:var(--gap) 16px 64px; }

  /* Category dropdowns */
  details.cat { border-bottom:1px solid var(--line); }
  details.cat:last-child { border-bottom:none; }
  details.cat summary { list-style:none; cursor:pointer; padding:18px 0; }
  details.cat:first-child summary { padding-top:4px; }
  details.cat summary::-webkit-details-marker { display:none; }
  .end { display:flex; align-items:center; gap:14px; }
  details.cat[open] summary .chev { transform:rotate(45deg); }
  .inner { margin:0 0 18px 4px; padding-left:16px; border-left:2px solid var(--line); }
  .inner .row { padding:12px 0; }
  .inner .row:first-child { padding-top:2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Spending Tracker</h1>
    <div class="controls">
      <span id="status">Loading…</span>
      <select id="cycle" aria-label="Month"></select>
      <button id="update">Update</button>
      <form id="logout" method="post" action="/logout" hidden><button class="plain">Log out</button></form>
    </div>
  </header>
  <div id="error"></div>

  <div class="overview" id="overview">
    <div class="card hero wide now">
      <div class="num good" id="left">–</div>
      <div class="desc" id="leftWords">left</div>
      <div class="extra" id="leftExtra"></div>
    </div>
    <div class="card now"><div class="num" id="perDay">–</div><div class="desc">per day</div></div>
    <div class="card now"><div class="num spend" id="week">–</div><div class="desc">spent this week</div></div>
    <div class="card wide">
      <div class="num spend" id="spent">–</div>
      <div class="desc" id="spentWords">spent this month</div>
      <div class="extra" id="spentExtra"></div>
    </div>
  </div>

  <div class="grid">
    <div class="card tap" data-sheet="cats" role="button" tabindex="0"><div class="head"><h2>By category</h2><span class="chev" aria-hidden="true"></span></div><div id="cats"></div></div>
    <div class="card tap" data-sheet="places" role="button" tabindex="0"><div class="head"><h2>Top places</h2><span class="chev" aria-hidden="true"></span></div><div id="places"></div></div>
  </div>

  <div class="card tap" data-sheet="list" role="button" tabindex="0"><div class="head"><h2>Transactions</h2><span class="chev" aria-hidden="true"></span></div><div id="list"></div></div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head"><div>
    <button class="plain back" id="sheetBack" aria-label="Back">‹</button>
    <div><h2 id="sheetTitle"></h2><div class="meta" id="sheetSub"></div></div>
  </div></div>
  <div class="sheet-body"><div class="card" id="sheetBody"></div></div>
</div>

<script>
const DAY = 864e5;
let DATA = null;
let VIEW = null; // what the dashboard is showing, for the full views

const $ = id => document.getElementById(id);
const rm = n => 'RM ' + Number(n).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const spentIn = list => list.reduce((s, t) => s - t.amount, 0); // money out of a list of debits, as a positive number
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const daysBetween = (a, b) => Math.round((b - a) / DAY);
const dShort = d => d.toLocaleDateString('en-MY', { day: 'numeric', month: 'short' });
const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

// The summary covers a monthly cycle from the 7th to the 6th, e.g. 7 Nov – 6 Dec, keyed by the year and month it starts in.
// "Left" counts down to the next payday instead (the 7th or the 22nd), since Wise is topped up on both.
const payDay = () => (DATA && DATA.cycleDay) || 7;
const paydays = () => (DATA && DATA.paydays) || [7, 22];
function nextPayday(now) {
  const today = startOfDay(now), dates = [];
  for (const m of [0, 1]) for (const d of paydays()) dates.push(new Date(today.getFullYear(), today.getMonth() + m, d));
  return dates.filter(d => d > today).sort((a, b) => a - b)[0];
}
function cycleStart(d) {
  const s = new Date(d.getFullYear(), d.getMonth(), payDay());
  return d < s ? new Date(d.getFullYear(), d.getMonth() - 1, payDay()) : s;
}
const cycleEnd = s => new Date(s.getFullYear(), s.getMonth() + 1, s.getDate());
const keyOf = s => s.getFullYear() + '-' + String(s.getMonth() + 1).padStart(2, '0');
const keyToStart = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, payDay()); };
function cycleLabel(k) {
  const s = keyToStart(k), last = new Date(s.getFullYear(), s.getMonth() + 1, s.getDate() - 1);
  return dShort(s) + ' – ' + dShort(last) + (last.getFullYear() !== new Date().getFullYear() ? ' ' + last.getFullYear() : '');
}

function update() {
  $('update').disabled = true;
  $('status').textContent = 'Updating…';
  $('error').style.display = 'none';
  fetch('/api/data', { cache: 'no-store' })
    .then(r => {
      if (r.status === 401) { location.href = '/login'; return new Promise(() => {}); } // logged out
      return r.json();
    })
    .then(d => {
      if (d.error) throw new Error(d.error);
      $('logout').hidden = !d.canLogout;
      DATA = d;
      DATA.tx.forEach(t => { t.d = new Date(t.date); t.cycle = keyOf(cycleStart(t.d)); });
      fillCycles();
      render();
      $('status').textContent = 'Updated ' + new Date(d.updated).toLocaleTimeString('en-MY', { hour: 'numeric', minute: '2-digit' });
    })
    .catch(e => {
      const msg = (e && e.message) || String(e);
      $('error').textContent = e instanceof TypeError // fetch's network error (wording differs per browser)
        ? "Can't reach the tracker. Check your internet, or open SpendingTracker again if you use the laptop app."
        : msg;
      $('error').style.display = 'block';
      $('status').textContent = 'Update failed';
    })
    .finally(() => { $('update').disabled = false; });
}

function fillCycles() {
  const sel = $('cycle');
  const current = keyOf(cycleStart(new Date()));
  const chosen = sel.value || current;
  const keys = [...new Set(DATA.tx.map(t => t.cycle).concat(current))].sort().reverse();
  sel.innerHTML = keys.map(k => `<option value="${k}">${cycleLabel(k)}</option>`).join('');
  sel.value = keys.includes(chosen) ? chosen : current;
}

function render() {
  if (!DATA) return;
  const key = $('cycle').value;
  const now = new Date();
  const start = keyToStart(key), end = cycleEnd(start);
  const isCurrent = key === keyOf(cycleStart(now));
  const tx = DATA.tx.filter(t => t.cycle === key).sort((a, b) => b.d - a.d);
  const out = tx.filter(t => t.amount < 0);
  const spent = spentIn(out);

  // Overview: "left", per day and "this week" only make sense for the month you're in now
  $('overview').classList.toggle('past', !isCurrent);
  document.querySelectorAll('#overview .now').forEach(el => { el.hidden = !isCurrent; });
  if (isCurrent) renderNow(now);
  const days = isCurrent ? daysBetween(start, startOfDay(now)) + 1 : daysBetween(start, end);
  $('spent').textContent = rm(spent);
  $('spentWords').textContent = isCurrent ? 'spent this month' : 'spent in ' + cycleLabel(key);
  $('spentExtra').textContent = 'avg ' + rm(spent / days) + ' a day';
  fitNumbers();

  // The dashboard shows the top 5 of each list; tapping a card opens all of it (see openSheet)
  VIEW = { key, tx, out, spent, cats: byCategory(out), places: byPlace(out) };
  $('cats').innerHTML = preview(VIEW.cats, c => catRow(c, spent), 'No spending yet.');
  $('places').innerHTML = preview(VIEW.places, p => placeRow(p, false), 'Nothing yet.');
  $('list').innerHTML = preview(tx, t => txRow(t, false), 'No transactions yet.');
}

// The Wise balance is what's left: you top up your spending money on each payday.
function renderNow(now) {
  const payday = nextPayday(now);
  const daysLeft = daysBetween(startOfDay(now), payday); // counts today
  const bal = DATA.balance;
  $('left').textContent = bal == null ? '–' : (bal < 0 ? '−' : '') + rm(Math.abs(bal));
  $('left').className = 'num ' + (bal != null && bal < 0 ? 'spend' : 'good');
  $('leftWords').textContent = 'left until ' + dShort(payday);
  $('leftExtra').textContent = plural(daysLeft, 'day') + ' left';
  // What you can spend per day until payday
  $('perDay').textContent = bal == null ? '–' : rm(bal > 0 ? bal / daysLeft : 0);

  const monday = startOfDay(now);
  monday.setDate(monday.getDate() - (monday.getDay() + 6) % 7); // weeks run Monday to Sunday
  $('week').textContent = rm(spentIn(DATA.tx.filter(t => t.amount < 0 && t.d >= monday)));
}

// Shrink an overview number just enough to fit its card. Only long amounts on narrow phones need it,
// e.g. "per day" the day before payday, when it's the whole balance.
function fitNumbers() {
  document.querySelectorAll('#overview .num').forEach(el => {
    el.style.fontSize = '';
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth && size > 14) el.style.fontSize = --size + 'px';
  });
}
window.addEventListener('resize', fitNumbers);

// ---- Lists ----

// Places, highest total first, with how many times you paid there
function byPlace(out) {
  const m = {};
  out.forEach(t => {
    const p = m[t.name] || (m[t.name] = { name: t.name, category: t.category, total: 0, count: 0 });
    p.total -= t.amount;
    p.count += 1;
  });
  return Object.values(m).sort((a, b) => b.total - a.total);
}

// Categories, highest first, each with its own places
function byCategory(out) {
  const m = {};
  out.forEach(t => (m[t.category] || (m[t.category] = [])).push(t));
  return Object.entries(m)
    .map(([name, list]) => ({ name, total: spentIn(list), count: list.length, places: byPlace(list) }))
    .sort((a, b) => b.total - a.total);
}

const preview = (items, toRow, empty) => !items.length ? `<p class="empty">${empty}</p>`
  : items.slice(0, 5).map(toRow).join('') + (items.length > 5 ? `<div class="more">+${items.length - 5} more</div>` : '');
const pctOf = (v, spent) => spent ? v / spent * 100 : 0;
const whenText = d => d.toLocaleDateString('en-MY', { weekday: 'short', day: 'numeric', month: 'short' }) + ', ' +
                      d.toLocaleTimeString('en-MY', { hour: 'numeric', minute: '2-digit' });
const line1 = (name, amt, amtClass = '') => `<div class="line1"><span class="name">${esc(name)}</span><span class="amt ${amtClass}">${amt}</span></div>`;
const barLine = pct => `<div class="barline"><div class="bar"><span style="width:${pct}%"></span></div><span class="pct">${pct.toFixed(0)}%</span></div>`;

// A list row: the name and amount, then one piece of info per line
const row = (name, amt, lines, amtClass) =>
  `<div class="row">${line1(name, amt, amtClass)}${lines.filter(Boolean).map(l => `<div class="meta">${esc(l)}</div>`).join('')}</div>`;

const catRow = (c, spent) => `<div class="row">${line1(c.name, rm(c.total))}${barLine(pctOf(c.total, spent))}</div>`;
const placeRow = (p, full) => row(p.name, rm(p.total), [plural(p.count, 'time'), full && p.category]);

// Full rows add Wise's note when it says more than the name.
// Card notes ("Card transaction of 12.50 MYR issued by …") only repeat the row, so they're skipped.
function txRow(t, full) {
  const note = full && t.note && t.note.toLowerCase() !== t.name.toLowerCase() && !/^card transaction of /i.test(t.note) && t.note;
  const amt = (t.amount > 0 ? '+' : '') + rm(Math.abs(t.amount));
  return row(t.name, amt, [whenText(t.d), t.category, note], t.amount > 0 ? 'in' : '');
}

// ---- Full views ----
const SHEETS = {
  cats: {
    title: 'By category',
    body: v => !v.cats.length ? '<p class="empty">No spending yet.</p>' : v.cats.map(c =>
      `<details class="cat"><summary>` +
        `<div class="line1"><span class="name">${esc(c.name)}</span><span class="end"><span class="amt">${rm(c.total)}</span><span class="chev" aria-hidden="true"></span></span></div>` +
        barLine(pctOf(c.total, v.spent)) +
        `<div class="meta">${plural(c.count, 'payment')}</div>` +
      `</summary><div class="inner">${c.places.map(p => placeRow(p, false)).join('')}</div></details>`).join(''),
  },
  places: {
    title: 'All places',
    body: v => !v.places.length ? '<p class="empty">Nothing yet.</p>' : v.places.map(p => placeRow(p, true)).join(''),
  },
  list: {
    title: 'All transactions',
    body: v => !v.tx.length ? '<p class="empty">No transactions yet.</p>' : v.tx.map(t => txRow(t, true)).join(''),
  },
};

function openSheet(kind) {
  if (!VIEW) return;
  const s = SHEETS[kind];
  $('sheetTitle').textContent = s.title;
  $('sheetSub').textContent = cycleLabel(VIEW.key) + (kind === 'list' ? ' · ' + plural(VIEW.tx.length, 'transaction') : '');
  $('sheetBody').innerHTML = s.body(VIEW);
  $('sheet').hidden = false;
  $('sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  history.pushState({ sheet: kind }, ''); // so the phone's back gesture closes it
  $('sheetBack').focus();
}
function closeSheet() {
  if ($('sheet').hidden) return;
  $('sheet').hidden = true;
  document.body.style.overflow = '';
}
window.addEventListener('popstate', closeSheet);
$('sheetBack').addEventListener('click', () => history.back());
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) history.back(); });
document.querySelectorAll('[data-sheet]').forEach(card => {
  card.addEventListener('click', () => openSheet(card.dataset.sheet));
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(card.dataset.sheet); } });
});

$('update').addEventListener('click', update);
$('cycle').addEventListener('change', render);
update();
</script>
</body>
</html>
