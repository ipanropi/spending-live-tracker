<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spending Tracker</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#111110">
<style>
  :root { color-scheme:dark; --bg:#111110; --card:#1a1a19; --input:#222220; --text:#f0efec; --muted:#a09f97; --line:#2f2f2c;
          --accent:#2563eb; --bar:#3987e5; --out:#f87171; --in:#4ade80; --radius:4px; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:20px; }
  h1 { font-size:22px; margin:0; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  select, button { font:inherit; font-size:14px; padding:8px 12px; border-radius:var(--radius); border:1px solid var(--line); background:var(--input); color:var(--text); }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.6; cursor:default; }
  button.plain { background:var(--input); color:var(--text); border:1px solid var(--line); font-weight:500; }
  #logout { margin:0; }
  #status { color:var(--muted); font-size:13px; }
  #error { display:none; background:#2a1515; color:#fca5a5; border:1px solid #5c2424; padding:12px; border-radius:var(--radius); margin-bottom:12px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; min-width:0; }
  .overview { display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; margin-bottom:12px; }
  .overview.past { grid-template-columns:1fr; }
  .label { color:var(--muted); font-size:13px; }
  .hero-value { font-size:40px; font-weight:700; margin-top:4px; letter-spacing:-0.5px; font-variant-numeric:tabular-nums; }
  .value { font-size:26px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .sub { color:var(--muted); font-size:12px; margin-top:6px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  @media (max-width:800px) {
    .overview { grid-template-columns:1fr 1fr; }
    .overview .hero { grid-column:1 / -1; }
    .grid { grid-template-columns:1fr; }
  }
  @media (max-width:420px) { .hero-value { font-size:34px; } .value { font-size:22px; } }
  h2 { font-size:15px; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:8px 4px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .out { color:var(--out); } .in { color:var(--in); }
  .bar { height:6px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:6px; }
  .bar span { display:block; height:100%; background:var(--bar); }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Spending Tracker</h1>
    <div class="controls">
      <span id="status">Loading…</span>
      <select id="cycle" aria-label="Pay cycle"></select>
      <button id="update">Update</button>
      <form id="logout" method="post" action="/logout" hidden><button class="plain">Log out</button></form>
    </div>
  </header>
  <div id="error"></div>

  <div class="overview" id="overview">
    <div class="card hero" id="heroCard">
      <div class="label" id="leftLabel">Left until payday</div>
      <div class="hero-value" id="left">–</div>
      <div class="sub" id="pace"></div>
    </div>
    <div class="card"><div class="label" id="spentLabel">Spent</div><div class="value" id="spent">–</div><div class="sub" id="spentSub"></div></div>
    <div class="card" id="weekCard"><div class="label">Spent this week</div><div class="value" id="week">–</div><div class="sub" id="weekSub"></div></div>
  </div>

  <div class="grid">
    <div class="card"><h2>By category</h2><table id="cats"></table></div>
    <div class="card"><h2>Top places</h2><table id="places"></table></div>
  </div>

  <div class="card"><h2>Transactions</h2><table id="list"></table></div>
</div>

<script>
const DAY = 864e5;
let DATA = null;

const $ = id => document.getElementById(id);
const rm = n => 'RM ' + Number(n).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const spentIn = list => list.reduce((s, t) => s - t.amount, 0); // money out of a list of debits, as a positive number
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const daysBetween = (a, b) => Math.round((b - a) / DAY);
const dShort = d => d.toLocaleDateString('en-MY', { day: 'numeric', month: 'short' });

// The summary covers a monthly cycle from the 7th to the 6th, e.g. 7 Nov – 6 Dec, keyed by the year and month it starts in.
// "Left" counts down to the next payday instead (the 7th or the 22nd), since Wise is topped up on both.
const payDay = () => (DATA && DATA.cycleDay) || 7;
const paydays = () => (DATA && DATA.paydays) || [7, 22];
function nextPayday(now) {
  const today = startOfDay(now), dates = [];
  for (const m of [0, 1]) for (const d of paydays()) dates.push(new Date(today.getFullYear(), today.getMonth() + m, d));
  return dates.filter(d => d > today).sort((a, b) => a - b)[0];
}
function cycleStart(d) {
  const s = new Date(d.getFullYear(), d.getMonth(), payDay());
  return d < s ? new Date(d.getFullYear(), d.getMonth() - 1, payDay()) : s;
}
const cycleEnd = s => new Date(s.getFullYear(), s.getMonth() + 1, s.getDate()); // next payday
const keyOf = s => s.getFullYear() + '-' + String(s.getMonth() + 1).padStart(2, '0');
const keyToStart = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, payDay()); };
function cycleLabel(k) {
  const s = keyToStart(k), last = new Date(s.getFullYear(), s.getMonth() + 1, s.getDate() - 1);
  return dShort(s) + ' – ' + dShort(last) + (last.getFullYear() !== new Date().getFullYear() ? ' ' + last.getFullYear() : '');
}

function update() {
  $('update').disabled = true;
  $('status').textContent = 'Updating…';
  $('error').style.display = 'none';
  fetch('/api/data', { cache: 'no-store' })
    .then(r => {
      if (r.status === 401) { location.href = '/login'; return new Promise(() => {}); } // logged out
      return r.json();
    })
    .then(d => {
      if (d.error) throw new Error(d.error);
      $('logout').hidden = !d.canLogout;
      DATA = d;
      DATA.tx.forEach(t => { t.d = new Date(t.date); t.cycle = keyOf(cycleStart(t.d)); });
      fillCycles();
      render();
      $('status').textContent = 'Updated ' + new Date(d.updated).toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit' });
    })
    .catch(e => {
      const msg = (e && e.message) || String(e);
      $('error').textContent = e instanceof TypeError // fetch's network error (wording differs per browser)
        ? "Can't reach the tracker. Check your internet, or open SpendingTracker again if you use the laptop app."
        : msg;
      $('error').style.display = 'block';
      $('status').textContent = 'Update failed';
    })
    .finally(() => { $('update').disabled = false; });
}

function fillCycles() {
  const sel = $('cycle');
  const current = keyOf(cycleStart(new Date()));
  const chosen = sel.value || current;
  const keys = [...new Set(DATA.tx.map(t => t.cycle).concat(current))].sort().reverse();
  sel.innerHTML = keys.map(k => `<option value="${k}">${cycleLabel(k)}</option>`).join('');
  sel.value = keys.includes(chosen) ? chosen : current;
}

function render() {
  if (!DATA) return;
  const key = $('cycle').value;
  const now = new Date();
  const start = keyToStart(key), end = cycleEnd(start);
  const isCurrent = key === keyOf(cycleStart(now));
  const tx = DATA.tx.filter(t => t.cycle === key).sort((a, b) => b.d - a.d);
  const out = tx.filter(t => t.amount < 0);
  const spent = spentIn(out);

  // Overview: "left" and "this week" only make sense for the cycle you're in now
  $('overview').classList.toggle('past', !isCurrent);
  $('heroCard').hidden = $('weekCard').hidden = !isCurrent;
  if (isCurrent) renderNow(now);
  const days = isCurrent ? daysBetween(start, startOfDay(now)) + 1 : daysBetween(start, end);
  $('spentLabel').textContent = 'Spent ' + (isCurrent ? 'since ' + dShort(start) : cycleLabel(key));
  $('spent').textContent = rm(spent);
  $('spentSub').textContent = rm(spent / days) + ' a day';

  // By category, with each one's share of the spending
  const cats = {};
  out.forEach(t => { cats[t.category] = (cats[t.category] || 0) - t.amount; });
  const catList = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  $('cats').innerHTML = catList.length
    ? '<tr><th>Category</th><th class="num">Amount</th><th class="num">Share</th></tr>' +
      catList.map(([c, v]) => {
        const pct = spent ? v / spent * 100 : 0;
        return `<tr><td>${esc(c)}<div class="bar"><span style="width:${pct}%"></span></div></td>` +
               `<td class="num">${rm(v)}</td><td class="num">${pct.toFixed(0)}%</td></tr>`;
      }).join('')
    : '<tr><td class="empty">No spending in this cycle yet.</td></tr>';

  // Top places
  const places = {};
  out.forEach(t => {
    const p = places[t.name] || (places[t.name] = { total: 0, count: 0 });
    p.total -= t.amount;
    p.count += 1;
  });
  const top = Object.entries(places).sort((a, b) => b[1].total - a[1].total).slice(0, 5);
  $('places').innerHTML = top.length
    ? '<tr><th>Place</th><th class="num">Times</th><th class="num">Total</th></tr>' +
      top.map(([n, p]) => `<tr><td>${esc(n)}</td><td class="num">${p.count}</td><td class="num">${rm(p.total)}</td></tr>`).join('')
    : '<tr><td class="empty">Nothing yet.</td></tr>';

  // Transactions
  $('list').innerHTML = tx.length
    ? '<tr><th>When</th><th>Place</th><th>Category</th><th class="num">Amount</th></tr>' +
      tx.map(t => {
        const when = t.d.toLocaleDateString('en-MY', { day: 'numeric', month: 'short' }) + ', ' +
                     t.d.toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit' });
        const amt = (t.amount < 0 ? '−' : '+') + rm(Math.abs(t.amount));
        return `<tr><td>${when}</td><td>${esc(t.name)}</td><td>${esc(t.category)}</td>` +
               `<td class="num ${t.amount < 0 ? 'out' : 'in'}">${amt}</td></tr>`;
      }).join('')
    : '<tr><td class="empty">No transactions in this cycle yet.</td></tr>';
}

// The Wise balance is what's left: you top up your spending money on each payday.
function renderNow(now) {
  const payday = nextPayday(now);
  const daysLeft = daysBetween(startOfDay(now), payday); // counts today
  const bal = DATA.balance;
  $('leftLabel').textContent = 'Left until payday, ' + dShort(payday);
  $('left').textContent = bal == null ? '–' : (bal < 0 ? '−' : '') + rm(Math.abs(bal));
  $('left').classList.toggle('out', bal != null && bal < 0);
  const pace = [];
  if (bal > 0) {
    pace.push('About ' + rm(bal / daysLeft) + ' a day');
    if (daysLeft >= 7) pace.push(rm(bal / daysLeft * 7) + ' a week');
  }
  pace.push(daysLeft + (daysLeft === 1 ? ' day' : ' days') + ' to go');
  $('pace').textContent = pace.join(' · ');

  const monday = startOfDay(now);
  monday.setDate(monday.getDate() - (monday.getDay() + 6) % 7); // weeks run Monday to Sunday
  $('week').textContent = rm(spentIn(DATA.tx.filter(t => t.amount < 0 && t.d >= monday)));
  $('weekSub').textContent = 'Since Mon, ' + dShort(monday);
}

$('update').addEventListener('click', update);
$('cycle').addEventListener('change', render);
update();
</script>
</body>
</html>
