<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spending Tracker</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#111110">
<style>
  :root { color-scheme:dark; --bg:#111110; --card:#1a1a19; --input:#222220; --text:#f0efec; --muted:#a09f97; --line:#2f2f2c;
          --accent:#2563eb; --radius:4px; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px; }
  img { width:48px; height:48px; border-radius:6px; display:block; margin-bottom:12px; }
  h1 { font-size:20px; margin:0 0 16px; }
  label { display:block; font-size:14px; }
  input[type=password] { width:100%; font:inherit; font-size:16px; padding:10px 12px; margin-top:6px; border:1px solid var(--line); border-radius:var(--radius);
                         background:var(--input); color:var(--text); }
  input[type=password]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .check { display:flex; gap:8px; align-items:center; margin:14px 0 4px; }
  .hint { color:var(--muted); font-size:12px; margin:0 0 16px 24px; }
  button { width:100%; font:inherit; font-size:15px; font-weight:600; padding:10px; border:none; border-radius:var(--radius); background:var(--accent); color:#fff; cursor:pointer; }
  .error { background:#2a1515; color:#fca5a5; border:1px solid #5c2424; padding:10px 12px; border-radius:var(--radius); margin-bottom:14px; font-size:14px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <img src="/icon-192.png" alt="">
  <h1>Spending Tracker</h1>
  <!--ERROR-->
  <label>Password
    <input type="password" name="password" autocomplete="current-password" required autofocus>
  </label>
  <label class="check"><input type="checkbox" name="remember" value="1" checked> Keep me logged in on this device</label>
  <p class="hint">Untick this on a shared computer.</p>
  <button type="submit">Log in</button>
</form>
</body>
</html>
